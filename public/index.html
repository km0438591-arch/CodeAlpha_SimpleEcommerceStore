<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanchan Store - CodeAlpha Task 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
<h2>🛒 Kanchan Store</h2>
<div>
<button onclick="showCart()">Cart (<span id="cartCount">0</span>)</button>
<button id="authBtn" onclick="openAuth()">Login</button>
</div>
</nav>

<div class="container">
<div id="authModal" class="modal hidden">
<div class="modal-box">
<h3>Login / Register</h3>
<input id="name" placeholder="Name (for Register)">
<input id="email" placeholder="Email: test@gmail.com">
<input id="pass" type="password" placeholder="Password: 123">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<p id="authMsg"></p>
<button class="close" onclick="closeAuth()">X</button>
</div>
</div>

<div id="productDetail" class="modal hidden"><div class="modal-box" id="detailBox"></div></div>

<div id="cartModal" class="modal hidden">
<div class="modal-box">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<h4 id="cartTotal"></h4>
<input id="address" placeholder="Full Delivery Address">
<button onclick="placeOrder()" style="background:green">Place Order</button>
<p id="orderMsg" style="color:green;font-weight:bold"></p>
<button class="close" onclick="closeCart()">X</button>
</div>
</div>

<h1>All Products</h1>
<div id="products" class="grid"></div>
</div>
<script src="script.js"></script>
</body>
</html>
